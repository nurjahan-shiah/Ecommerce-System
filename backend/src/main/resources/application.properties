# Server Configuration
server.port=8080
spring.application.name=auction-system

# H2 Database Configuration (in-memory for now)
spring.datasource.url=jdbc:h2:file:./auctiondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (to view database in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.yorku.auction=DEBUG
logging.level.org.springframework.web=INFO