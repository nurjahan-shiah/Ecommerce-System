# Server Configuration
server.port=8080
spring.application.name=auction-system

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:./database/auction.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# 'validate' instead of 'update' — skips the slow schema diff scan on every startup
spring.jpa.hibernate.ddl-auto=none
# Turn off per-query SQL logging — it floods the console and adds measurable latency
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL init — run schema.sql + data.sql on startup (embedded DB only)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Connection pool — give SQLite a small dedicated pool so catalogue queries
# don't queue behind the SSE keep-alive connection
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000

# SSE: increase async request timeout so connections aren't killed early
spring.mvc.async.request-timeout=1800000

# Logging — keep application debug but silence noisy Spring internals
logging.level.com.yorku.auction=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

gemini.api.key=
