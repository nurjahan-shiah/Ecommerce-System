version: "3.9"

services:
  auction-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-auction-system
    image: atlas-auction-system:latest
    ports:
      - "8080:8080"
    volumes:
      - auction-db:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GEMINI_API_KEY=AIzaSyAbUuBLNcMsltPM_glaKMtfGqKBUIr-cw4
      - SPRING_APPLICATION_JSON={"gemini.api.key":""}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/catalogue/items/active"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  auction-db:
    driver: local